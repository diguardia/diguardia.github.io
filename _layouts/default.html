<!doctype html>
<html lang="{{ site.lang | default: 'es' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% if page.image %}<meta property="og:image" content="{{ site.url }}{{ page.image }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.author }} <span>· Juegos</span></a>
  </header>
  <main class="{{ page.main_class | default: 'page' }}">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>© {{ 'now' | date: '%Y' }} {{ site.author }} · <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
  </footer>
</body>
</html>
